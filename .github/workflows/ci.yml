name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-bbcafe-security.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-bbcafe-security
      NEXT_PUBLIC_FIREBASE_APP_ID: demo-app-id
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run audit:security
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-audit
          path: .security-audit/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  firebase:
    name: Firebase SDK compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:firebase
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: firebase-emulator-logs
          path: |
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7
